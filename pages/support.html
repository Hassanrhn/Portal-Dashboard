<!doctype html>
<html lang="en" data-theme="light" data-env="live">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Contact support · Portal</title>
  <link rel="stylesheet" href="../design-system/css/portal.css">
  <link rel="stylesheet" href="css/support.css">
  <script src="../design-system/js/theme.js"></script>
  <script src="../design-system/js/icons.js" defer></script>
  <script src="../design-system/js/dom.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="../design-system/js/components.js" defer></script>
  <script src="../design-system/js/patterns.js" defer></script>
  <script src="../design-system/js/lazy.js" defer></script>
  <script src="js/data/support.js" defer></script>
  <script src="js/support.js" defer></script>
  <script src="js/create-payment.js" defer></script>
  <script src="../design-system/js/shell.js" defer></script>
</head>
<body data-page="support">
<div class="app" data-app>
  <div class="main">
    <main class="page" id="main">
      <div class="page__head">
        <div>
          <h1 class="t-title">Contact support</h1>
          <p class="page__sub">Ask about a payment, payout or integration. We reply within one business day, and within the hour for urgent requests.</p>
        </div>
        <div class="page__actions">
          <button class="btn btn--primary btn--lg" type="button" data-new-request><i data-icon="plus"></i>New request</button>
        </div>
      </div>

      <div class="stack support">
        <section class="card" data-lazy="tickets" aria-busy="true" aria-labelledby="tickets-title">
          <div class="card__head"><h2 class="card__title" id="tickets-title">Your requests</h2></div>
          <div class="card__body">
            <div class="skeleton-stack" data-skeleton><div class="skeleton-row"><span class="skeleton skeleton--text"></span><span class="skeleton skeleton--pill"></span></div><div class="skeleton-row"><span class="skeleton skeleton--text"></span><span class="skeleton skeleton--pill"></span></div><div class="skeleton-row"><span class="skeleton skeleton--text"></span><span class="skeleton skeleton--pill"></span></div></div>
            <ul class="rows" data-lazy-content data-tickets></ul>
          </div>
        </section>

        <section class="card" data-lazy="status" aria-busy="true" aria-labelledby="status-title">
          <div class="card__head"><h2 class="card__title" id="status-title">System status</h2><span class="t-meta" data-status-summary></span></div>
          <div class="card__body">
            <div class="skeleton-stack" data-skeleton><div class="skeleton-row"><span class="skeleton skeleton--short"></span><span class="skeleton skeleton--pill"></span></div><div class="skeleton-row"><span class="skeleton skeleton--short"></span><span class="skeleton skeleton--pill"></span></div><div class="skeleton-row"><span class="skeleton skeleton--short"></span><span class="skeleton skeleton--pill"></span></div></div>
            <ul class="rows" data-lazy-content data-status></ul>
          </div>
        </section>

        <section class="card" aria-labelledby="contact-title">
          <div class="card__head"><h2 class="card__title" id="contact-title">Other ways to reach us</h2></div>
          <div class="card__body">
            <ul class="rows" data-contacts></ul>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</body>
</html>
