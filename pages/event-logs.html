<!doctype html>
<html lang="en" data-theme="light" data-env="live">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Event logs · Portal</title>
  <link rel="stylesheet" href="../design-system/css/portal.css">
  <link rel="stylesheet" href="css/event-logs.css">
  <script src="../design-system/js/theme.js"></script>
  <script src="../design-system/js/icons.js" defer></script>
  <script src="../design-system/js/dom.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="../design-system/js/components.js" defer></script>
  <script src="../design-system/js/patterns.js" defer></script>
  <script src="../design-system/js/lazy.js" defer></script>
  <script src="js/data/developers.js" defer></script>
  <script src="js/event-logs.js" defer></script>
  <script src="js/create-payment.js" defer></script>
  <script src="../design-system/js/shell.js" defer></script>
</head>
<body data-page="event-logs">
<div class="app" data-app>
  <div class="main">
    <main class="page" id="main">
      <div class="page__head">
        <div>
          <h1 class="t-title">Event logs</h1>
          <p class="page__sub">Every API request made with your keys and every event the platform emitted. Select a row for headers and payloads.</p>
        </div>
      </div>

      <div class="tabs log-tabs" role="tablist" aria-label="Log type" data-tabs>
        <button class="tabs__tab" type="button" role="tab" id="tab-requests" aria-controls="panel-requests" aria-selected="true" data-value="requests">API requests</button>
        <button class="tabs__tab" type="button" role="tab" id="tab-events" aria-controls="panel-events" aria-selected="false" data-value="events">Events</button>
      </div>

      <div role="tabpanel" id="panel-requests" aria-labelledby="tab-requests">
        <section class="card table-card" data-lazy="requests" aria-busy="true" aria-label="API requests">
          <div class="toolbar">
            <div class="input-group toolbar__search"><i data-icon="search" class="input-group__icon"></i><input class="input" type="search" placeholder="Path or request ID" aria-label="Search API requests" maxlength="80" data-filter="q"></div>
            <div class="segmented segmented--sm" role="radiogroup" aria-label="Status class" data-segmented data-filter="status">
              <button class="segmented__option" type="button" role="radio" aria-checked="true" data-value="all">All <span class="segmented__count" data-count="all"></span></button>
              <button class="segmented__option" type="button" role="radio" aria-checked="false" data-value="2xx">2xx <span class="segmented__count" data-count="2xx"></span></button>
              <button class="segmented__option" type="button" role="radio" aria-checked="false" data-value="4xx">4xx <span class="segmented__count" data-count="4xx"></span></button>
              <button class="segmented__option" type="button" role="radio" aria-checked="false" data-value="5xx">5xx <span class="segmented__count" data-count="5xx"></span></button>
            </div>
            <select class="select select--sm" aria-label="Method" data-filter="method">
              <option value="">All methods</option><option>GET</option><option>POST</option><option>DELETE</option>
            </select>
            <span class="toolbar__spacer"></span>
            <span class="live-tail">
              <span class="live-tail__dot" data-tail-dot aria-hidden="true"></span>
              <span id="tail-label">Live tail</span>
              <button class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="tail-label" data-switch data-tail></button>
            </span>
          </div>
          <div data-skeleton class="skeleton-list"></div>
          <div data-lazy-content data-requests-table></div>
        </section>
      </div>

      <div role="tabpanel" id="panel-events" aria-labelledby="tab-events" hidden>
        <section class="card table-card" data-lazy="events" aria-busy="true" aria-label="Events">
          <div class="toolbar">
            <div class="input-group toolbar__search"><i data-icon="search" class="input-group__icon"></i><input class="input" type="search" placeholder="Event type or object ID" aria-label="Search events" maxlength="80" data-filter="event-q"></div>
            <span class="toolbar__spacer"></span>
            <a class="btn btn--ghost btn--sm" href="webhooks.html">Manage webhooks<i data-icon="arrow-right"></i></a>
          </div>
          <div data-skeleton class="skeleton-list"></div>
          <div data-lazy-content data-events-table></div>
        </section>
      </div>
    </main>
  </div>
</div>
</body>
</html>
