<!doctype html>
<html lang="en" data-theme="light" data-env="live">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Refunds · Portal</title>
  <link rel="stylesheet" href="../design-system/css/portal.css">
  <link rel="stylesheet" href="css/refunds.css">
  <script src="../design-system/js/theme.js"></script>
  <script src="../design-system/js/icons.js" defer></script>
  <script src="../design-system/js/dom.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="../design-system/js/components.js" defer></script>
  <script src="../design-system/js/patterns.js" defer></script>
  <script src="../design-system/js/lazy.js" defer></script>
  <script src="js/data/payments.js" defer></script>
  <script src="js/data/refunds.js" defer></script>
  <script src="js/refunds.js" defer></script>
  <script src="js/create-payment.js" defer></script>
  <script src="../design-system/js/shell.js" defer></script>
</head>
<body data-page="refunds">
<div class="app" data-app>
  <div class="main">
    <main class="page" id="main">
      <div class="page__head">
        <div>
          <h1 class="t-title">Refunds</h1>
          <p class="page__sub">Money returned to customers on paid payments. Select a row for details.</p>
        </div>
        <div class="page__actions">
          <button class="btn btn--lg" type="button" data-export><i data-icon="download"></i>Export CSV</button>
          <button class="btn btn--primary btn--lg" type="button" data-new-refund><i data-icon="refund"></i>Refund a payment</button>
        </div>
      </div>

      <div class="stack">
        <section class="kpi-strip kpi-strip--3" aria-label="Refund summary" data-lazy="refund-kpis" aria-busy="true">
          <div class="kpi">
            <p class="kpi__label">Refunded, last 30 days</p>
            <div class="skeleton-stack page-kpi-skeleton" data-skeleton><span class="skeleton skeleton--figure"></span><span class="skeleton skeleton--text"></span></div>
            <div data-lazy-content>
              <p class="kpi__value t-figure"><span data-kpi="refunded">0</span><span class="kpi__unit">USD eq.</span></p>
              <p class="kpi__meta" data-kpi-meta="refunded"></p>
            </div>
          </div>
          <div class="kpi">
            <p class="kpi__label">Pending refunds</p>
            <div class="skeleton-stack page-kpi-skeleton" data-skeleton><span class="skeleton skeleton--figure"></span><span class="skeleton skeleton--text"></span></div>
            <div data-lazy-content>
              <p class="kpi__value t-figure"><span data-kpi="pending">0</span></p>
              <p class="kpi__meta" data-kpi-meta="pending"></p>
            </div>
          </div>
          <div class="kpi">
            <p class="kpi__label">Refund rate, last 30 days</p>
            <div class="skeleton-stack page-kpi-skeleton" data-skeleton><span class="skeleton skeleton--figure"></span><span class="skeleton skeleton--text"></span></div>
            <div data-lazy-content>
              <p class="kpi__value t-figure"><span data-kpi="rate">0</span><span class="kpi__unit">%</span></p>
              <p class="kpi__meta" data-kpi-meta="rate"></p>
            </div>
          </div>
        </section>

        <section class="card table-card" data-lazy="refunds" aria-busy="true" aria-label="Refunds">
          <div class="toolbar">
            <div class="input-group toolbar__search"><i data-icon="search" class="input-group__icon"></i><input class="input" type="search" placeholder="rf_…, req_77b0… or ORD-10492" aria-label="Search refunds" maxlength="80" data-filter="q"></div>
            <div class="segmented segmented--sm" role="radiogroup" aria-label="Status" data-segmented data-filter="status">
              <button class="segmented__option" type="button" role="radio" aria-checked="true" data-value="all">All <span class="segmented__count" data-count="all"></span></button>
              <button class="segmented__option" type="button" role="radio" aria-checked="false" data-value="pending">Pending <span class="segmented__count" data-count="pending"></span></button>
              <button class="segmented__option" type="button" role="radio" aria-checked="false" data-value="succeeded">Succeeded <span class="segmented__count" data-count="succeeded"></span></button>
              <button class="segmented__option" type="button" role="radio" aria-checked="false" data-value="failed">Failed <span class="segmented__count" data-count="failed"></span></button>
            </div>
            <span class="toolbar__spacer"></span>
            <button class="btn btn--ghost btn--sm" type="button" data-clear hidden>Clear filters</button>
          </div>
          <div data-skeleton class="skeleton-list"></div>
          <div data-lazy-content data-table></div>
        </section>
      </div>
    </main>
  </div>
</div>
</body>
</html>
